//================= Description ===========================================
// This file handles the entire Cashshop. You can simply add in any amount
// of items you like within each category. Please keep in mind that the
// Cashshop does not work with ragexeRE clients.
// Categories can be empty or even missing, but, if present, their names
// must be kept as cat_<n>, where <n> is a valid tab index, as described
// in 'enum CASH_SHOP_TABS' in clif.c (normally 0 through 7)
//=========================================================================

// Seal Cascade DM reward shop. Ported from npc/merchants/cash_trader.txt
// (Hercules' stock iRO-based cash shop list, headgears intentionally
// omitted) so @dm points grants have something worth spending on. Prices
// are Kafra/Cash Points, not zeny -- see @dm points in dm_console.txt.
cash_shop: (
{
	cat_0: { // New
		Battle_Manual_Box:1000
		Bubble_Gum_Box:1000
		Insurance_Package:200
	}

	cat_1: { // Popular
		Giant_Fly_Wing_Box:100
		Kafra_Card_Box:100
		Neuralizer_Box:1500
	}

	cat_2: { // Limited
		Token_Of_Siegfried_Box:150
		Dun_Tele_Scroll1_Box:50
	}

	cat_3: { // Rental
		Enriched_Elunium:100
		Enriched_Oridecon:100
	}

	cat_4: { // Permanent
		Assumptio_5_Scroll_Box:150
		Wind_Walk_10_Scroll_Box:150
	}

	cat_5: { // Scroll
		Aspersio_5_Scroll_Box:100
		Adrenaline_Scroll_Box:100
		Blessing_10_Scroll_Box:125
		Inc_Agi_10_Scroll_Box:125
	}

	cat_6: { // Usable
		Str_Dish_Box:100
		Agi_Dish_Box:100
		Int_Dish_Box:100
		Dex_Dish_Box:100
		Luk_Dish_Box:100
		Vit_Dish_Box:100
	}

	cat_7: { // Other
		Max_Weight_Up_Scroll:50
	}
}
)
