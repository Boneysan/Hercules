#    uses: ./.github/workflows/gcc_test.yml
  gccsnapshot_test:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/gccsnapshot_test.yml
  mariadb:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/mariadb.yml
