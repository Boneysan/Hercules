name: controller

on:
  push:
  pull_request:
  # Weekly, so the fork keeps getting built even in quiet weeks -- advisories
  # and toolchain drift land against code that has not changed.
  #
  # NOTE: GitHub reads `schedule` ONLY from the default branch (`stable` here).
  # While this sits on an agent branch it will never fire, no matter how the
  # cron is written. The same trap cost the paired korangar repo a scheduled
  # integration run that had never once executed.
  schedule:
    - cron: "41 9 * * 1"

# Never let a scheduled run pile up on a slow week.
concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `hwsapibot` is upstream's build-stats reporter, gated to pushes on `master`
  # -- a branch this fork does not have -- so it could never run here. Dropped
  # rather than carried as a permanently-skipped job that can still fail the
  # whole workflow at startup.
  codeql:
    if: ${{ !failure() && !cancelled() }}
    # A called workflow cannot request more than its caller grants, and
    # codeql-analysis.yml needs `security-events: write` to upload results. The
    # caller has to hand it down explicitly.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml
  tools:
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/tools.yml
  build:
    needs: tools
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build.yml
  gccsnapshot_test:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/gccsnapshot_test.yml
  mariadb:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/mariadb.yml
