name: controller

on:
  push:
  pull_request:
  # Weekly, so the fork keeps getting built even in quiet weeks -- advisories
  # and toolchain drift land against code that has not changed.
  #
  # NOTE: GitHub reads `schedule` ONLY from the default branch (`stable` here).
  # While this sits on an agent branch it will never fire, no matter how the
  # cron is written. The same trap cost the paired korangar repo a scheduled
  # integration run that had never once executed.
  schedule:
    - cron: "41 9 * * 1"

# Never let a scheduled run pile up on a slow week.
concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hwsapibot:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/hwsapibot.yml
    secrets: inherit
  codeql:
    needs: hwsapibot
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/codeql-analysis.yml
  tools:
    needs: hwsapibot
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/tools.yml
  build:
    needs: tools
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build.yml
#  clang_test:
#    needs: build
#    if: ${{ !failure() && !cancelled() }}
#    uses: ./.github/workflows/clang_test.yml
