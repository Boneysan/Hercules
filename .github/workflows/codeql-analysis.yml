name: "CodeQL"

on: workflow_call

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['c', 'python']

    # No job-level `concurrency` here. It used to group on
    # `..._${{ matrix.language }}`, and the `matrix` context is NOT available in
    # `jobs.<id>.concurrency` -- concurrency is resolved before the matrix
    # expands. That made this file fail validation, and because `controller.yml`
    # reaches it through `uses:`, GitHub validated it while creating every run
    # and killed the entire workflow at startup: no jobs, and no error beyond
    # "this run likely failed because of a workflow file issue".
    #
    # Dropping the matrix from the group is not an alternative -- the two
    # language legs would then share a group and cancel each other. The caller
    # carries workflow-level concurrency instead.

    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
