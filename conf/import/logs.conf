//= Hercules Log local configuration file.
//=========================================================================

map_log: {
	// See conf/map/logs.conf for details
	// Seal Cascade: log every zeny change. Stock is 0 (off). Item movements
	// are already logged in full (conf/map/logs.conf `enable`, `log_filter: 1`);
	// without this, a zeny duplication or loss leaves no trace. Force-tracked,
	// like conf/import/battle.conf, so a fresh checkout logs zeny too.
	log_zeny: 1

	// Seal Cascade: log every item movement except (M) monster drops to the
	// floor (0x00000008). Those rows were most of picklog (2.5 million on the
	// dev database, 2026-10-04) and record no player: they are logged against
	// the monster. What a player actually receives is still logged -- floor
	// pickups and autoloot as (P), party share, trades, shops, storage -- so
	// korangar's item-conservation audit is unaffected. Monster zeny is not
	// filtered by this mask (log_zeny above).
	enable: 0xFFFFFFF7
}
